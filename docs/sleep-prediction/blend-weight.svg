<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 672 282" width="672" height="282" role="img" aria-label="Chart of the observed-data weight rising linearly from 0 at n=2 to 0.7 at n=7.6 and staying flat afterwards, with confidence bands."><style>
svg{--panel:#ffffff;--panel-2:#ecebfb;--line:rgba(27,30,75,.14);--text:#15173d;--muted:#5a5c8f;--lavender:#5b5ce0;--lav-soft:rgba(91,92,224,.14);--sun:#b07a10;--sun-soft:rgba(214,158,40,.18);--coral:#c2553b;--coral-soft:rgba(194,85,59,.14);--mint:#1f8a6e;--mint-soft:rgba(31,138,110,.14)}
@media (prefers-color-scheme: dark){svg{--panel:#13163a;--panel-2:#1b1e4b;--line:rgba(255,255,255,.12);--text:#f4f4fa;--muted:#a9a9d6;--lavender:#8b8cf6;--lav-soft:rgba(139,140,246,.2);--sun:#f5c86b;--sun-soft:rgba(245,200,107,.2);--coral:#e8846b;--coral-soft:rgba(232,132,107,.2);--mint:#9be3cf;--mint-soft:rgba(155,227,207,.2)}}
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;fill:var(--muted);font-size:12px}
.t-strong{fill:var(--text);font-weight:600}
.t-disp{font-family:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:var(--text);font-size:15px;font-weight:700}
</style><rect x="-16" y="-16" width="672" height="282" rx="16" style="fill:var(--panel)"/>
      <!-- x: n 0..20 → 60 + n*27 ; y: w 0..1 → 200 - w*220*... use 0..0.8 → 200 - w*200 -->
      <rect x="60" y="20" width="81" height="180" style="fill:var(--coral-soft)"></rect>
      <rect x="141" y="20" width="189" height="180" style="fill:var(--sun-soft)"></rect>
      <rect x="330" y="20" width="270" height="180" style="fill:var(--mint-soft)"></rect>
      <text x="68" y="36" style="fill:var(--coral)">niedrig</text><text x="149" y="36" style="fill:var(--sun)">mittel</text><text x="338" y="36" style="fill:var(--mint)">hoch</text>
      <g style="stroke:var(--line)"><line x1="60" y1="200" x2="600" y2="200"></line><line x1="60" y1="60" x2="600" y2="60" stroke-dasharray="3 4"></line><line x1="60" y1="130" x2="600" y2="130" stroke-dasharray="3 4"></line></g>
      <polyline points="60,200 114,200 265.2,60 600,60" style="fill:none;stroke:var(--lavender);stroke-width:3;stroke-linejoin:round"></polyline>
      <circle cx="265.2" cy="60" r="5" style="fill:var(--lavender)"></circle>
      <text x="275" y="54" class="t-strong">70 % cap from n ≈ 8</text>
      <text x="22" y="204">0 %</text><text x="16" y="134">35 %</text><text x="16" y="64">70 %</text>
      <text x="56" y="222">0</text><text x="110" y="222">2</text><text x="137" y="222">3</text><text x="322" y="222">10</text><text x="457" y="222">15</text><text x="592" y="222">20</text>
      <text x="250" y="244">observed wake windows (n)</text>
    </svg>
