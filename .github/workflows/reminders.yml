name: Nuggi reminders

# Calls the reminder scheduler every 5 minutes (GitHub's minimum). GitHub may
# delay scheduled runs by a few minutes under load; the endpoint's ±5 min window
# and dedupe keys tolerate that, the breast cue arrives up to one interval late.
# cron-job.org can run in parallel (even every minute) without double sends.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger /api/cron/reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL || 'https://nuggi-ten.vercel.app' }}
        run: |
          set -euo pipefail
          body=$(curl -sS --max-time 60 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders")
          echo "$body"
          echo "$body" | grep -q '"ok":true'
